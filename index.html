<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | SITTA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark"><strong>SITTA</strong><span>Sistem Informasi Tracking dan Distribusi Bahan Ajar</span></div>
    <h1>Selamat Datang</h1>
    <p class="subtitle">Masuk untuk mengelola distribusi bahan ajar.</p>
    <form id="loginForm">
      <label class="field"><span>Email</span><input id="email" type="email" placeholder="nama@ut.ac.id" required></label>
      <label class="field"><span>Password</span><input id="password" type="password" placeholder="Masukkan password" required></label>
      <div class="login-actions"><a class="text-link" href="#" id="forgotPassword">Lupa password?</a></div>
      <button class="button gold full" type="submit">Masuk</button>
      <p class="message" id="loginMessage" role="alert"></p>
    </form>
    <p class="login-footer">Belum punya akun? <a class="text-link" href="#" id="registerLink">Daftar sekarang</a></p>
  </main>
  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
